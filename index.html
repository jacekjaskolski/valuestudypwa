<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ededed" />
    <title>Value Study</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app" id="app" data-view="both">
      <header class="header">
        <h1 class="header__title">Value Study</h1>
        <div class="segmented" role="group" aria-label="View">
          <button type="button" class="segmented__button" data-view="both">Both</button>
          <button type="button" class="segmented__button" data-view="photo">Photo</button>
          <button type="button" class="segmented__button" data-view="study">Study</button>
        </div>
      </header>

      <!--
        One grid over both images and both control blocks, rather than a row of images above a
        strip of controls. Each panel's controls sit under the panel they belong to, and the two
        images still share a grid row, which is what keeps them exactly the same size.
      -->
      <main class="workspace">
        <figure class="panel panel--photo">
          <div class="frame frame--empty" id="photoFrame">
            <canvas id="originalCanvas" class="frame__canvas"></canvas>
            <span class="frame__placeholder">No photo loaded</span>
          </div>
          <figcaption class="panel__label">Photo</figcaption>
        </figure>

        <section class="dock dock--photo" aria-label="Photo controls">
          <div class="slider">
            <label class="slider__label" for="squint">
              Squint
              <output class="slider__value" id="squintValue"></output>
            </label>
            <input
              type="range"
              id="squint"
              class="slider__input"
              min="0"
              max="100"
              step="1"
              value="0"
            />
          </div>

          <!-- Only meaningful once there is a depth map to drive them. -->
          <div class="group" id="aerialControls" hidden>
            <div class="slider">
              <label class="slider__label" for="aerialStart">
                Haze from
                <output class="slider__value" id="aerialStartValue"></output>
              </label>
              <input
                type="range"
                id="aerialStart"
                class="slider__input"
                min="0"
                max="100"
                step="1"
                value="35"
              />
            </div>
            <div class="slider">
              <label class="slider__label" for="aerialStrength">
                Haze strength
                <output class="slider__value" id="aerialStrengthValue"></output>
              </label>
              <input
                type="range"
                id="aerialStrength"
                class="slider__input"
                min="0"
                max="100"
                step="1"
                value="50"
              />
            </div>
          </div>

          <progress class="progress" id="depthProgress" max="1" hidden></progress>
          <p class="status" id="depthStatus">
            Depth estimation downloads a model, around 27&nbsp;MB, once per browser.
          </p>

          <div class="row">
            <label class="check">
              <input type="checkbox" id="keepHighlights" class="check__input" checked />
              <span>Preserve highlights</span>
            </label>
            <label class="check" id="showDepthMapField" hidden>
              <input type="checkbox" id="showDepthMap" class="check__input" />
              <span>Show depth map</span>
            </label>

            <button type="button" id="estimateDepth" class="button button--end">
              Estimate depth
            </button>
            <!--
              No `capture` attribute: on iOS it forces the camera and removes the photo library
              from the picker. See NOTES.md.
            -->
            <label class="button">
              <input type="file" id="fileInput" class="button__input" accept="image/*" />
              <span id="loadLabel">Load photo</span>
            </label>
          </div>
        </section>

        <figure class="panel panel--study">
          <div class="frame frame--empty" id="studyFrame">
            <canvas id="studyCanvas" class="frame__canvas"></canvas>
            <span class="frame__placeholder" id="studyPlaceholder">
              Your value study appears here
            </span>
          </div>
          <figcaption class="panel__label">Study</figcaption>
        </figure>

        <section class="dock dock--study" aria-label="Study controls">
          <div class="readout">
            <span class="readout__item">
              Darks <output class="readout__value" id="cutDarkValue"></output>
            </span>
            <span class="readout__item">
              Lights <output class="readout__value" id="cutLightValue"></output>
            </span>
          </div>

          <!--
            One control, not three: the two boundaries are handles on the same axis, and the
            histogram is the background they are dragged across. The bands behind the bars are the
            three zones, so the control reads as a miniature of the study it produces.
          -->
          <div class="valuebar" id="valueBar">
            <canvas id="histogram" class="valuebar__chart" aria-hidden="true"></canvas>
            <div
              class="valuebar__handle valuebar__handle--dark"
              id="darkHandle"
              role="slider"
              tabindex="0"
              aria-label="Darks boundary"
              aria-valuemin="0"
              aria-valuemax="100"
            ></div>
            <div
              class="valuebar__handle"
              id="lightHandle"
              role="slider"
              tabindex="0"
              aria-label="Lights boundary"
              aria-valuemin="0"
              aria-valuemax="100"
            ></div>
          </div>

          <div class="slider">
            <label class="slider__label" for="simplify">
              Simplify shapes
              <output class="slider__value" id="simplifyValue"></output>
            </label>
            <input
              type="range"
              id="simplify"
              class="slider__input"
              min="0"
              max="100"
              step="1"
              value="10"
            />
          </div>

          <div class="group" id="distantControls" hidden>
            <div class="slider">
              <label class="slider__label" for="distantStart">
                Distance from
                <output class="slider__value" id="distantStartValue"></output>
              </label>
              <input
                type="range"
                id="distantStart"
                class="slider__input"
                min="0"
                max="100"
                step="1"
                value="35"
              />
            </div>
            <div class="slider">
              <label class="slider__label" for="distantStrength">
                Lighten distance
                <output class="slider__value" id="distantStrengthValue"></output>
              </label>
              <input
                type="range"
                id="distantStrength"
                class="slider__input"
                min="0"
                max="100"
                step="1"
                value="50"
              />
            </div>
          </div>

          <div class="row">
            <label class="check">
              <input type="checkbox" id="showDarks" class="check__input" />
              <span>Show darks</span>
            </label>
            <label class="check">
              <input type="checkbox" id="greyscale" class="check__input" checked />
              <span>Flat grey</span>
            </label>
            <label class="check" id="distantField" hidden>
              <input type="checkbox" id="distant" class="check__input" />
              <span>Decrease distant values</span>
            </label>
            <button type="button" id="reset" class="button button--end">Reset</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
