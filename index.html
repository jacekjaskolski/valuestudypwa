<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Value Study</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="header__title">Value Study</h1>
      </header>

      <main class="panels">
        <figure class="panel">
          <!--
            The photo frame is itself the file picker, so the button sits where the photo goes and
            the same target swaps the photo later. No `capture` attribute: on iOS it forces the
            camera and removes the photo library from the picker. See NOTES.md.
          -->
          <label class="frame frame--empty frame--pickable" id="photoFrame">
            <input type="file" id="fileInput" class="frame__input" accept="image/*" />
            <canvas id="originalCanvas" class="frame__canvas"></canvas>
            <span class="frame__placeholder">
              <span class="frame__button">Load photo</span>
            </span>
          </label>
          <figcaption class="panel__label" id="photoCaption">Photo</figcaption>
        </figure>

        <figure class="panel">
          <div class="frame frame--empty" id="studyFrame">
            <canvas id="studyCanvas" class="frame__canvas"></canvas>
            <span class="frame__placeholder" id="studyPlaceholder">
              Your value study appears here
            </span>
          </div>
          <figcaption class="panel__label">Study</figcaption>
        </figure>
      </main>

      <section class="controls">
        <div class="readout">
          <span class="readout__item">
            Darks <output class="readout__value" id="cutDarkValue"></output>
          </span>
          <span class="readout__item">
            Lights <output class="readout__value" id="cutLightValue"></output>
          </span>
        </div>

        <!--
          One control, not three: the two boundaries are handles on the same axis, and the
          histogram is the background they are dragged across. The bands behind the bars are the
          three zones, so the control reads as a miniature of the study it produces.
        -->
        <div class="valuebar" id="valueBar">
          <canvas id="histogram" class="valuebar__chart" aria-hidden="true"></canvas>
          <div
            class="valuebar__handle valuebar__handle--dark"
            id="darkHandle"
            role="slider"
            tabindex="0"
            aria-label="Darks boundary"
            aria-valuemin="0"
            aria-valuemax="100"
          ></div>
          <div
            class="valuebar__handle"
            id="lightHandle"
            role="slider"
            tabindex="0"
            aria-label="Lights boundary"
            aria-valuemin="0"
            aria-valuemax="100"
          ></div>
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="showDarks" class="check__input" />
            <span>Show darks</span>
          </label>
          <label class="check">
            <input type="checkbox" id="greyscale" class="check__input" checked />
            <span>Flat grey</span>
          </label>
          <button type="button" id="reset" class="button">Reset</button>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
